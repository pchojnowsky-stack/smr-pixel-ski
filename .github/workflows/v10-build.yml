name: SMR 1.0 build actual OpenSkiMap piste and 3D terrain
on:
  push:
    branches: [stage-10-openskimap-rebuild]
    paths: ['tools/build_openskimap_scene.py','.github/workflows/v10-build.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-10-openskimap-rebuild
      - uses: actions/download-artifact@v4
        with:
          name: szczyrk-geo-source-v09
          run-id: 42978075146
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: v10/work/
      - name: Rebuild terrain based on OpenSkiMap 3D run and forest polygons
        run: python tools/build_openskimap_scene.py
      - name: Commit generated terrain data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v10/data/scene.json
          git diff --cached --quiet || (git commit -m "Generate OpenSkiMap 3D terrain, forest and piste axis" && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smr-v10-built-3d-terrain
          path: v10/data/scene.json
          retention-days: 14
