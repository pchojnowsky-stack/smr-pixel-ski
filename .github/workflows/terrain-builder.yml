name: SMR Terrain Builder 0.9.2 — unit validation
on:
  pull_request:
    paths:
      - 'tools/terrain_builder.py'
      - 'tools/test_terrain_builder.py'
      - '.github/workflows/terrain-builder.yml'
  push:
    branches: [stage-092-terrain-builder-and-forest]
    paths:
      - 'tools/terrain_builder.py'
      - 'tools/test_terrain_builder.py'
      - '.github/workflows/terrain-builder.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy rasterio pyproj shapely
      - run: python -m unittest discover -s tools -p 'test_terrain_builder.py' -v
