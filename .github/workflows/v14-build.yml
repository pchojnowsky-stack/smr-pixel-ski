name: SMR 1.4 build expanded resort geodata
on:
  push:
    branches: [stage-14-expanded-resort]
    paths:
      - 'tools/build_expanded_resort.py'
      - '.github/workflows/v14-build.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-14-expanded-resort
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: szczyrk-geo-source-v09
          run-id: 42978075146
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: v14/work/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - run: python tools/build_expanded_resort.py
      - name: Commit 3 sector scenes and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v14/data/
          git diff --cached --quiet || (git commit -m "Generate real OpenSkiMap resort zones, terrain, runs and lifts" && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smr-v14-expanded-resort-data
          path: v14/data/
          retention-days: 14
