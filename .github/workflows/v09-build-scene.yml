name: SMR 0.9 Build Georeferenced Scene
on:
  push:
    branches: [stage-09-szczyrk-real-geodata]
    paths:
      - 'tools/build_szczyrk_scene.py'
      - 'tools/validate_szczyrk_scene.py'
      - '.github/workflows/v09-build-scene.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-09-szczyrk-real-geodata
      - uses: actions/download-artifact@v4
        with:
          name: szczyrk-geo-source-v09
          run-id: 42978075146
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: v09/data/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install shapely
      - name: Build georeferenced terrain and feature dataset
        run: |
          python tools/build_szczyrk_scene.py
          python tools/validate_szczyrk_scene.py
      - name: Commit generated source data for the playable preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v09/data/scene.json
          git diff --cached --quiet || (git commit -m "Generate actual OSM/DEM Szumarjanka scene data" && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smr-stage-09-geodata-scene
          path: v09/data/scene.json
          retention-days: 14
