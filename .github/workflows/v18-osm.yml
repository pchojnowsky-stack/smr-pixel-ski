name: Import verified OSM forests and buildings for SnowEngine 1.8
on:
  workflow_dispatch:
  push:
    branches: [stage-18-osm-forest-buildings]
    paths:
      - 'tools/build_smr18_osm.py'
      - '.github/workflows/v18-osm.yml'
permissions:
  contents: write
jobs:
  osm:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: smr18-osm-import
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-18-osm-forest-buildings
          persist-credentials: true
      - name: Install polygon tools
        run: python -m pip install --disable-pip-version-check shapely
      - name: Fetch and spatially verify forests and buildings from OSM Overpass
        run: python tools/build_smr18_osm.py --sectors hala golgota skrzyczne
      - name: Validate georeferenced OSM extracts
        run: |
          python - <<'PY'
          import json,pathlib
          d=pathlib.Path("v18/data")
          index=json.loads((d/"osm-manifest.json").read_text())
          assert sorted(index["sectors"])==["golgota","hala","skrzyczne"]
          for sector in index["sectors"]:
              scene=json.loads((d/(sector+".json")).read_text())
              trees=scene["trees"];buildings=scene["buildings"];src=scene["source"]
              assert scene["format"]=="smr18-osm-geolocated-landcover"
              assert src["forest_procedural_fallback"] is False
              assert len(trees)>=40 and len(buildings)>=5
              assert len(set(x["id"] for x in buildings))==len(buildings)
              assert src["woodland_after_exclusion_m2"]>1200
              print(sector, len(trees), "polygon-constrained trees",len(buildings),"OSM mapped buildings")
          PY
      - name: Commit verified OSM geometry while preserving other edits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/smr18-osm-verified
          cp v18/data/{osm-manifest,hala,golgota,skrzyczne}.json /tmp/smr18-osm-verified/
          git fetch origin stage-18-osm-forest-buildings
          git reset --hard origin/stage-18-osm-forest-buildings
          cp /tmp/smr18-osm-verified/*.json v18/data/
          git add v18/data/osm-manifest.json v18/data/hala.json v18/data/golgota.json v18/data/skrzyczne.json
          if ! git diff --cached --quiet; then
            git commit -m "Import spatially verified OSM woodland and building footprints for all three sectors"
            git push origin HEAD:stage-18-osm-forest-buildings
          fi
