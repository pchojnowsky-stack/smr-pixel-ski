name: SnowEngine 1.3 mobile controls QA
on:
  push:
    branches: [stage-13-dual-stick-spins, main]
    paths: ['v13/**','.github/workflows/v13-visual.yml']
  pull_request:
    paths: ['v13/**','.github/workflows/v13-visual.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - run: |
          node --check v13/engine.js
          node --check v13/freeride.js
          node --check v13/tricks.js
          node --check v13/game.js
          node --check v13/visual-qa.cjs
          node v13/physics.test.cjs
      - run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - run: node v13/visual-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smr-v13-smartphone-control-screens
          path: v13/qa/
          retention-days: 14
